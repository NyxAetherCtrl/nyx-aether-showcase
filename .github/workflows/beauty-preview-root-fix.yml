name: Finish Beauty preview thumbnail links

on:
  push:
    branches:
      - portfolio/beauty-preview-thumbnails
    paths:
      - .github/workflows/beauty-preview-root-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/beauty-preview-thumbnails
      - name: Use compact Brand preview in root README
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '[![Beauty Intelligence — Production Brand Snapshot](assets/beauty/beauty-production-brand-snapshot.png)](https://raw.githubusercontent.com/NyxAetherCtrl/nyx-aether-showcase/main/assets/beauty/beauty-production-brand-snapshot.png)'
          new = '[![Beauty Intelligence — Production Brand Snapshot](assets/beauty/beauty-production-brand-preview.png)](https://raw.githubusercontent.com/NyxAetherCtrl/nyx-aether-showcase/main/assets/beauty/beauty-production-brand-snapshot.png)'
          if old not in s:
              raise SystemExit('expected root README image markup not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/beauty-preview-root-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "portfolio: use Beauty preview thumbnail in root README [skip ci]"
          git push origin HEAD:portfolio/beauty-preview-thumbnails
