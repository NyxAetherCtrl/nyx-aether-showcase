name: Fix Beauty viewer link markup

on:
  push:
    branches:
      - portfolio/beauty-fullpage-viewer
    paths:
      - .github/workflows/beauty-viewer-link-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/beauty-fullpage-viewer
      - name: Fix root README links
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          raw = 'https://raw.githubusercontent.com/NyxAetherCtrl/nyx-aether-showcase/main/assets/beauty/beauty-production-brand-snapshot.png'
          double = f'[[![Beauty Intelligence — Production Brand Snapshot](assets/beauty/beauty-production-brand-snapshot.png)]({raw})]({raw})'
          single = f'[![Beauty Intelligence — Production Brand Snapshot](assets/beauty/beauty-production-brand-snapshot.png)]({raw})'
          if double not in s:
              raise SystemExit('double link not found')
          s = s.replace(double, single, 1)
          plain = '![Beauty Intelligence — Production Brand Snapshot](assets/beauty/beauty-production-brand-snapshot.png)'
          # Replace the remaining unwrapped lower image only.
          idx = s.rfind(plain)
          if idx == -1:
              raise SystemExit('lower plain image not found')
          s = s[:idx] + single + s[idx+len(plain):]
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/beauty-viewer-link-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "portfolio: fix Beauty full-page viewer links [skip ci]"
          git push origin HEAD:portfolio/beauty-fullpage-viewer
