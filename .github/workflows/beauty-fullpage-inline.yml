name: Restore Beauty full-page inline screenshots

on:
  push:
    branches:
      - portfolio/beauty-fullpage-inline
    paths:
      - .github/workflows/beauty-fullpage-inline.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/beauty-fullpage-inline
      - name: Replace preview crops with full-page production captures
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              'assets/beauty/beauty-production-brand-preview.png': 'assets/beauty/beauty-production-brand-snapshot.png',
              '../../assets/beauty/beauty-production-brand-preview.png': '../../assets/beauty/beauty-production-brand-snapshot.png',
              '../../assets/beauty/beauty-production-product-preview.png': '../../assets/beauty/beauty-production-product-snapshot.png',
              '../../assets/beauty/beauty-production-review-preview.png': '../../assets/beauty/beauty-production-review-explorer.png',
          }

          for filename in ['README.md', 'projects/beauty-intelligence/README.md']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  s = s.replace(old, new)
              s = s.replace(
                  '**Viewing tip:** The inline images are compact previews. Click any screenshot to open the complete full-page production capture.',
                  '**Viewing:** Each Beauty screenshot below is the complete full-page production capture shown inline — no crop or thumbnail preview.'
              )
              s = s.replace(
                  'Click the image to open the full-page capture directly.',
                  'The complete production page is shown inline.'
              )
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/beauty-fullpage-inline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "portfolio: show full-page Beauty screenshots inline [skip ci]"
          git push origin HEAD:portfolio/beauty-fullpage-inline
