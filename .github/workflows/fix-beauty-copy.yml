name: Fix Beauty portfolio copy typo

on:
  push:
    branches:
      - portfolio/beauty-production-screenshot
    paths:
      - .github/workflows/fix-beauty-copy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/beauty-production-screenshot
      - name: Fix typo and self-clean
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('projects/beauty-intelligence/README.md'); s=p.read_text(encoding='utf-8'); assert 'Production Review Expllorer' in s; p.write_text(s.replace('Production Review Expllorer','Production Review Explorer',1),encoding='utf-8')"
          rm -f .github/workflows/fix-beauty-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "portfolio: fix Review Explorer label [skip ci]"
          git push origin HEAD:portfolio/beauty-production-screenshot
