name: Repo rename link cleanup

on:
  push:
    branches:
      - portfolio/rename-link-cleanup
    paths:
      - .github/workflows/rename-link-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/rename-link-cleanup
      - name: Replace old repository URLs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          old = 'NyxAetherCtrl/nyx-aether-showcase'
          new = 'NyxAetherCtrl/samuel-choi-data-science-portfolio'
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              if p.suffix.lower() not in {'.md', '.txt', '.yml', '.yaml', '.json'}:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')
                  changed.append(str(p))
          print('changed:', changed)
          PY
          rm -f .github/workflows/rename-link-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "portfolio: update links after repository rename [skip ci]"
          git push origin HEAD:portfolio/rename-link-cleanup
