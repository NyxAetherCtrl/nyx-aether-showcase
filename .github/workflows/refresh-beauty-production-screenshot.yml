name: Finalize Beauty portfolio evidence

on:
  push:
    branches:
      - portfolio/beauty-production-screenshot
    paths:
      - .github/workflows/refresh-beauty-production-screenshot.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/beauty-production-screenshot
      - name: Finalize production evidence
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/finalize.py
          python /tmp/finalize.py
          git status --short
      - name: Commit finalized branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "portfolio: replace stale Beauty visuals with live production evidence [skip ci]"
          git push origin HEAD:portfolio/beauty-production-screenshot
