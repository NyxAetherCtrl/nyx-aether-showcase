name: Finalize Beauty production portfolio evidence

on:
  push:
    branches:
      - portfolio/beauty-production-screenshot
    paths:
      - .github/workflows/refresh-beauty-production-screenshot.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio/beauty-production-screenshot

      - name: Update portfolio copy and remove stale evidence
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('README.md')
          text = root.read_text(encoding='utf-8')

          old_preview = '''These are shipped product surfaces, not mockups. The technical case studies below explain the data and evaluation systems behind them.

| NYX Aether — Baseball Intelligence | Beauty Intelligence |
|---|---|
| ![NYX Aether Overview](assets/screenshots/overview.png) | ![Beauty Intelligence Terminal](assets/beauty/beauty-home.png) |
| Live MLB slate, model context, and game intelligence | Consumer-review intelligence organized into business-facing modules |'''
          new_preview = '''These are current shipped product surfaces captured from the live products, not mockups. The technical case studies below explain the data and evaluation systems behind them.

| NYX Aether — Baseball Intelligence | Beauty Intelligence |
|---|---|
| ![NYX Aether Overview](assets/screenshots/overview.png) | ![Beauty Intelligence — Production Brand Snapshot](assets/beauty/beauty-production-brand-snapshot.png) |
| Live MLB slate, model context, and game intelligence | Current production Brand Snapshot: brand health, complaint, rating, pricing, and portfolio signals |'''
          if old_preview not in text:
              raise SystemExit('Root product-preview block not found exactly; refusing partial edit.')
          text = text.replace(old_preview, new_preview, 1)

          old_lower = '''![Beauty Intelligence — Brand Intelligence](assets/beauty/beauty-brand.png)

*Brand Intelligence connects review volume, benefits, complaints, emerging signals, and market context in one decision surface.*'''
          new_lower = '''![Beauty Intelligence — Production Brand Snapshot](assets/beauty/beauty-production-brand-snapshot.png)

*The current production Brand Snapshot combines review coverage, brand health, complaint incidence, rating distribution, price positioning, and portfolio-level signals in one decision surface.*'''
          if old_lower not in text:
              raise SystemExit('Root Beauty image block not found exactly; refusing partial edit.')
          text = text.replace(old_lower, new_lower, 1)
          root.write_text(text, encoding='utf-8')

          beauty = Path('projects/beauty-intelligence/README.md')
          text = beauty.read_text(encoding='utf-8')
          start = text.index('## Product evidence\n')
          end = text.index('## End-to-end DS workflow\n')
          replacement = '''## Product evidence

These screenshots were captured from the **live production product**, not from the older screenshot folder in the private source repository.

### Production Brand Snapshot

![Beauty Intelligence — Production Brand Snapshot](../../assets/beauty/beauty-production-brand-snapshot.png)

*The current production Brand Snapshot brings review coverage, retailer mix, brand health, complaint incidence, rating distribution, price positioning, and product-portfolio signals into one decision surface.*

### Product Snapshot

![Beauty Intelligence — Production Product Snapshot](../../assets/beauty/beauty-production-product-snapshot.png)

*Product-level analysis carries the same evidence model into product health, complaint radar, retailer coverage, rating trends, review momentum, and real-review voices.*

### Review Explorer

![Beauty Intelligence — Production Review Explorer](../../assets/beauty/beauty-production-review-explorer.png)

*The Review Explorer links summary metrics back to filterable review evidence, related issues, retailer/rating facets, and searchable consumer language.*

Together these production surfaces show the analytical chain: **review evidence → semantic extraction → governed metrics → brand/product analytics → decision-facing production UI**.

'''
          text = text[:start] + replacement + text[end:]
          beauty.write_text(text, encoding='utf-8')
          PY

          rm -f \
            assets/beauty/beauty-home.png \
            assets/beauty/beauty-brand.png \
            assets/beauty/beauty-complaints.png \
            assets/beauty/beauty-shift.png \
            assets/beauty/beauty-production-products.png \
            assets/beauty/beauty-production-reviews.png

          # This capture/finalization workflow is one-off portfolio plumbing and must
          # not remain in the finished hiring-facing branch.
          rm -f .github/workflows/refresh-beauty-production-screenshot.yml

      - name: Verify final references
        shell: bash
        run: |
          test -f assets/beauty/beauty-production-brand-snapshot.png
          test -f assets/beauty/beauty-production-product-snapshot.png
          test -f assets/beauty/beauty-production-review-explorer.png
          ! grep -R "beauty-home.png\|beauty-brand.png\|beauty-complaints.png\|beauty-shift.png\|beauty-production-products.png\|beauty-production-reviews.png" README.md projects/beauty-intelligence/README.md
          grep -q "beauty-production-brand-snapshot.png" README.md
          grep -q "beauty-production-product-snapshot.png" projects/beauty-intelligence/README.md
          grep -q "beauty-production-review-explorer.png" projects/beauty-intelligence/README.md
          git status --short

      - name: Commit finalized portfolio evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "portfolio: replace stale Beauty visuals with live production evidence [skip ci]"
          git push origin HEAD:portfolio/beauty-production-screenshot
